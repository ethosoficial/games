<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHOS TECHNOLOGIES • NEON v3.1</title>
<style>
    :root {
        --neon-cyan: #00f7ff;
        --neon-pink: #ff00ff;
        --neon-purple: #9d00ff;
        --bg: #0a0a12;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        height: 100vh;
        background: var(--bg);
        color: var(--neon-cyan);
        font-family: 'Courier New', monospace;
        overflow: hidden;
        position: relative;
    }

    canvas#matrix { position: fixed; inset: 0; z-index: 1; opacity: 0.7; }
    
    .grid-bg {
        position: fixed;
        inset: 0;
        background: linear-gradient(rgba(0,247,255,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0,247,255,0.04) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: gridMove 30s linear infinite;
        z-index: 2;
        pointer-events: none;
    }

    #introScreen {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, rgba(15,15,35,0.95), #0a0a12);
        transition: opacity 1.5s;
    }

    .holo-logo {
        width: 260px;
        height: 260px;
        border: 4px solid var(--neon-cyan);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 80px var(--neon-cyan),
                    inset 0 0 60px rgba(0,247,255,0.5);
        animation: holoPulse 4s ease-in-out infinite alternate;
    }

    .holo-logo::after {
        content: "ETHOS";
        font-size: 4.8rem;
        font-weight: 900;
        letter-spacing: 15px;
        text-shadow: 0 0 50px var(--neon-pink);
    }

    .terminal {
        width: 720px;
        max-width: 94vw;
        background: rgba(8,10,22,0.97);
        border: 3px solid var(--neon-cyan);
        box-shadow: 0 0 60px var(--neon-cyan),
                    0 0 120px rgba(157,0,255,0.4);
        padding: 55px 50px;
        margin-top: 50px;
    }

    .fakeInput {
        width: 100%;
        background: #000;
        border: 3px solid var(--neon-cyan);
        padding: 24px 28px;
        font-size: 2.3rem;
        letter-spacing: 8px;
        color: var(--neon-cyan);
        text-shadow: 0 0 15px var(--neon-cyan);
    }

    .cursor { animation: blink 0.7s infinite; }

    @keyframes blink { 50% { opacity: 0; } }
    @keyframes holoPulse { to { box-shadow: 0 0 100px var(--neon-cyan), 0 0 160px var(--neon-pink); } }
    @keyframes gridMove { to { background-position: 50px 50px; } }
</style>
</head>
<body>

<canvas id="matrix"></canvas>
<div class="grid-bg"></div>

<div id="introScreen">
    <div class="holo-logo"></div>
    <div style="margin-top:40px; font-size:2.9rem; letter-spacing:12px; text-shadow:0 0 40px var(--neon-cyan);">ETHOS TECHNOLOGIES</div>
    <div style="margin-top:70px; font-size:1.35rem; opacity:0.75;">NEURAL ACCESS v3.1 • CLASSIFIED</div>
</div>

<div id="loginScreen" style="display:none; position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;">
    <div class="terminal">
        <h1 style="text-align:center; margin-bottom:35px; color:var(--neon-pink); letter-spacing:6px;">ACCESO RESTRINGIDO</h1>
        
        <div class="fakeInput" id="fakeInput">
            <span id="fakeText"></span><span class="cursor">█</span>
        </div>
        
        <input type="password" id="realInput" style="position:absolute; left:-9999px;">
        
        <div style="text-align:center; margin-top:50px; font-size:1.5rem; letter-spacing:4px; color:#00ffaa;" id="enterHint">
            [ PRESIONE ENTER PARA CONECTAR ]
        </div>
    </div>
</div>

<script>
// Matrix Rain
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const chars = "01アイウエオ0123456789ETHOS▓▒░█◆◇";
let drops = Array(Math.floor(width/18)).fill(1);

function drawMatrix() {
    ctx.fillStyle = 'rgba(10,10,18,0.1)';
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#00f7ff';
    ctx.font = '15px monospace';

    for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(text, i*18, drops[i]*18);
        if (drops[i]*18 > height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 40);

// Login
const realInput = document.getElementById("realInput");
const fakeText = document.getElementById("fakeText");

realInput.addEventListener("input", () => {
    fakeText.textContent = "●".repeat(realInput.value.length);
});

realInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        const clave = realInput.value.trim();
        if (clave === "Reset") {
            window.location.href = "ethos.html";   // ← Cambia si usas ?page=player
        } else {
            alert("❌ ACCESO DENEGADO");
            realInput.value = "";
            fakeText.textContent = "";
        }
    }
});

// Intro → Login
setTimeout(() => {
    document.getElementById('introScreen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('introScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        realInput.focus();
    }, 1400);
}, 3800);
</script>
</body>
</html>
